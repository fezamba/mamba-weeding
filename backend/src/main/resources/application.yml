spring:
  application:
    name: mamba-wedding

  profiles:
    default: dsv

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    clean-disabled: true
    validate-migration-naming: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

api:
  security:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
    admin:
      emails: ${ADMIN_EMAILS}
    token:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      expiration-hours: ${JWT_EXPIRATION_HOURS:2}
